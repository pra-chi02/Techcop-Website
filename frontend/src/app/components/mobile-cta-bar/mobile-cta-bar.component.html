<!-- =========================================================
     MOBILE QUICK CONTACT BAR
========================================================= -->
<div
  class="sm:hidden fixed bottom-0 left-0 right-0 z-[60]
         bg-[#07182B]/95 backdrop-blur-xl
         border-t border-white/10
         shadow-[0_-8px_30px_rgba(0,0,0,0.25)]
         pb-[env(safe-area-inset-bottom)]"
>

  <div class="grid grid-cols-2 max-w-lg mx-auto">

    <!-- ================= CALL ================= -->
    <a
      [href]="'tel:' + phone"
      aria-label="Call Now"
      class="relative group
             flex items-center justify-center
             gap-2.5
             py-3.5 px-4
             text-white
             font-semibold text-sm
             border-r border-white/10
             active:bg-white/10
             transition-all duration-200"
    >

      <!-- Icon -->
      <span
        class="w-9 h-9
               rounded-xl
               bg-orange-500/15
               border border-orange-400/20
               text-orange-400
               flex items-center justify-center
               group-active:scale-95
               transition"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4"
        >
          <path
            d="M22 16.92v3a2 2 0 0 1-2.18 2
               19.79 19.79 0 0 1-8.63-3.07
               19.5 19.5 0 0 1-6-6
               19.79 19.79 0 0 1-3.07-8.67
               A2 2 0 0 1 4.11 2h3
               a2 2 0 0 1 2 1.72
               c.127.96.361 1.903.7 2.81
               a2 2 0 0 1-.45 2.11L8.09 9.91
               a16 16 0 0 0 6 6l1.27-1.27
               a2 2 0 0 1 2.11-.45
               c.907.339 1.85.573 2.81.7
               A2 2 0 0 1 22 16.92z"
          />
        </svg>
      </span>

      <!-- Text -->
      <span class="flex flex-col items-start leading-tight">
        <span class="text-[10px] text-slate-400 font-medium">
          Need Help?
        </span>

        <span class="text-sm font-bold text-white">
          {{ translate.t('Call Now') }}
        </span>
      </span>

    </a>


    <!-- ================= WHATSAPP ================= -->
    <a
      [href]="whatsappUrl"
      target="_blank"
      rel="noopener noreferrer"
      aria-label="Chat on WhatsApp"
      class="relative group
             flex items-center justify-center
             gap-2.5
             py-3.5 px-4
             bg-[#16823A]
             hover:bg-[#1A9343]
             active:bg-[#126B30]
             text-white
             transition-all duration-200"
    >

      <!-- Online indicator -->
      <span
        class="absolute
               top-2.5 right-3
               w-2 h-2
               rounded-full
               bg-emerald-300
               ring-2 ring-[#16823A]"
      ></span>


      <!-- WhatsApp Icon -->
      <span
        class="w-9 h-9
               rounded-xl
               bg-white/15
               border border-white/10
               flex items-center justify-center
               group-active:scale-95
               transition"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="white"
          class="w-5 h-5"
        >
          <path
            d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91
               c0 1.75.46 3.45 1.32 4.95L2.05 22l5.25-1.38
               a9.9 9.9 0 0 0 4.74 1.21h.01
               c5.46 0 9.9-4.45 9.9-9.91
               0-2.65-1.03-5.14-2.9-7.01
               A9.86 9.86 0 0 0 12.04 2Zm0 18.13h-.01
               a8.2 8.2 0 0 1-4.19-1.15l-.3-.18-3.11.82
               .83-3.04-.2-.31a8.18 8.18 0 0 1-1.26-4.36
               c0-4.53 3.7-8.22 8.24-8.22
               a8.19 8.19 0 0 1 5.82 2.41
               8.15 8.15 0 0 1 2.41 5.81
               c0 4.53-3.7 8.22-8.23 8.22Zm4.51-6.16
               c-.25-.12-1.47-.72-1.69-.81-.23-.08-.39-.12-.56.13
               -.17.25-.64.81-.78.97-.14.17-.29.19-.53.06
               -.25-.12-1.05-.39-2-1.23-.74-.66-1.24-1.48-1.39-1.73
               -.14-.25-.02-.38.11-.51
               .11-.11.25-.29.37-.43
               .12-.14.16-.25.25-.41
               .08-.17.04-.31-.02-.43
               -.06-.12-.56-1.35-.77-1.85
               -.2-.48-.41-.42-.56-.43h-.48
               c-.17 0-.43.06-.66.31
               -.23.25-.86.85-.86 2.07
               0 1.22.89 2.4 1.01 2.56
               .12.17 1.75 2.67 4.24 3.74
               .59.26 1.05.41 1.41.52
               .59.19 1.13.16 1.55.1
               .47-.07 1.47-.6 1.68-1.19
               .21-.58.21-1.08.14-1.19
               -.06-.1-.23-.16-.48-.28Z"
          />
        </svg>
      </span>


      <!-- Text -->
      <span class="flex flex-col items-start leading-tight">
        <span class="text-[10px] text-white/70 font-medium">
          Quick Support
        </span>

        <span class="text-sm font-bold">
          {{ translate.t('WhatsApp') }}
        </span>
      </span>

    </a>

  </div>
</div>
