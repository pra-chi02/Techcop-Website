<!-- =========================================================
     FLOATING WHATSAPP BUTTON - DESKTOP
========================================================= -->
<a
  [href]="whatsappUrl"
  target="_blank"
  rel="noopener noreferrer"
  aria-label="Chat with us on WhatsApp"
  class="hidden sm:flex fixed
         bottom-6 right-6
         z-[55]
         group
         items-center gap-3"
>

  <!-- Pulse Glow -->
  <span
    class="absolute
           inset-0
           rounded-full
           bg-[#25D366]/30
           animate-ping
           opacity-60">
  </span>


  <!-- Label -->
  <span
    class="absolute
           right-[4.25rem]
           whitespace-nowrap
           opacity-0
           translate-x-2
           group-hover:opacity-100
           group-hover:translate-x-0
           pointer-events-none
           transition-all duration-300
           bg-[#07182B]
           border border-white/10
           text-white
           text-xs
           font-semibold
           px-3.5
           py-2
           rounded-lg
           shadow-xl"
  >
    Chat with us
  </span>


  <!-- Button -->
  <span
    class="relative
           w-14 h-14
           rounded-full
           bg-[#25D366]
           hover:bg-[#20bd5a]
           border-4 border-white
           shadow-[0_8px_30px_rgba(37,211,102,0.35)]
           flex items-center justify-center
           transition-all duration-300
           group-hover:scale-110
           group-active:scale-95"
  >

    <!-- WhatsApp Icon -->
    <svg
      xmlns="http://www.w3.org/2000/svg"
      viewBox="0 0 24 24"
      fill="#ffffff"
      class="w-7 h-7"
    >

        d="M12.04 2C6.58 2 2.13 6.45 2.13 11.91

           8.15 8.15 0 0 1 2.41 5.81

    <!-- Online Dot -->
    <span
      class="absolute
             bottom-0.5
             right-0.5
             w-3.5 h-3.5
             rounded-full
             bg-white
             flex items-center justify-center"
    >
      <span
        class="w-2 h-2
               rounded-full
               bg-emerald-500"
      ></span>
    </span>

  </span>

</a>
