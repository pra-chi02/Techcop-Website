<div class="space-y-3">

  <div
    *ngFor="let item of items; let i = index"
    class="group rounded-2xl bg-white overflow-hidden
           border transition-all duration-300"
    [class.border-orange-300]="openIndex === i"
    [class.shadow-lg]="openIndex === i"
    [class.shadow-orange-100]="openIndex === i"
    [class.border-slate-200]="openIndex !== i"
    [class.hover:border-orange-200]="openIndex !== i"
  >

    <!-- Question Button -->
    <button
      type="button"
      (click)="toggle(i)"
      class="w-full flex items-center justify-between gap-4
             px-5 sm:px-6 py-5
             text-left
             transition-colors duration-300"
      [attr.aria-expanded]="openIndex === i"
    >

      <!-- Left Content -->
      <span class="flex items-center gap-4 min-w-0">

        <!-- Number -->
        <span
          class="w-9 h-9 rounded-xl
                 flex items-center justify-center
                 text-xs font-extrabold
                 flex-shrink-0
                 transition-all duration-300"
          [class.bg-orange-500]="openIndex === i"
          [class.text-slate-950]="openIndex === i"
          [class.shadow-md]="openIndex === i"
          [class.bg-slate-100]="openIndex !== i"
          [class.text-slate-500]="openIndex !== i"
        >
          {{ i + 1 }}
        </span>

        <!-- Question -->
        <span
          class="font-bold text-sm sm:text-base
                 leading-relaxed
                 transition-colors duration-300"
          [class.text-orange-600]="openIndex === i"
          [class.text-slate-900]="openIndex !== i"
        >
          {{ item.question }}
        </span>

      </span>


      <!-- Arrow -->
      <span
        class="w-9 h-9 rounded-full
               bg-slate-100
               flex items-center justify-center
               flex-shrink-0
               transition-all duration-300"
        [class.bg-orange-500]="openIndex === i"
      >

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4
                 transition-all duration-300"
          [class.rotate-180]="openIndex === i"
          [class.text-slate-950]="openIndex === i"
          [class.text-slate-500]="openIndex !== i"
        >
          <path d="m6 9 6 6 6-6"></path>
        </svg>

      </span>

    </button>


    <!-- Answer -->
    <div
      *ngIf="openIndex === i"
      class="px-5 sm:px-6 pb-6"
    >

      <div
        class="ml-0 sm:ml-[52px]
               pt-4
               border-t border-orange-100"
      >

        <p
          class="text-sm sm:text-[15px]
                 text-slate-600
                 leading-7"
        >
          {{ item.answer }}
        </p>

      </div>

    </div>

  </div>

</div>
