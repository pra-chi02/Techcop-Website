<div class="space-y-3">
  <div *ngFor="let item of items; let i = index"
       class="border rounded-xl bg-white overflow-hidden transition"
       [class.border-orange-200]="openIndex === i"
       [class.shadow-sm]="openIndex === i"
       [class.border-slate-200]="openIndex !== i">
    <button (click)="toggle(i)" class="w-full flex items-center justify-between gap-4 px-5 py-4 text-left">
      <span class="flex items-center gap-3">
        <span class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold flex-shrink-0 transition"
              [class.bg-orange-500]="openIndex === i"
              [class.text-white]="openIndex === i"
              [class.bg-slate-100]="openIndex !== i"
              [class.text-slate-500]="openIndex !== i">?</span>
        <span class="font-semibold text-slate-900 text-sm sm:text-base">{{ item.question }}</span>
      </span>
      <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="w-5 h-5 text-orange-600 flex-shrink-0 transition-transform" [class.rotate-180]="openIndex === i"><path d="m6 9 6 6 6-6"></path></svg>
    </button>
    <div *ngIf="openIndex === i" class="px-5 pb-5 pl-16 text-sm text-slate-600 leading-relaxed">
      {{ item.answer }}
    </div>
  </div>
</div>
