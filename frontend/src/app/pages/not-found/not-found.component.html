<section class="relative min-h-[70vh] flex items-center justify-center overflow-hidden bg-[#050B18] text-white">

  <!-- Background glow -->
  <div class="absolute -top-32 -left-32 w-96 h-96 bg-orange-500/10 rounded-full blur-3xl"></div>
  <div class="absolute -bottom-32 -right-32 w-96 h-96 bg-blue-500/10 rounded-full blur-3xl"></div>

  <!-- Decorative grid -->
  <div
    class="absolute inset-0 opacity-[0.035]"
    style="background-image: linear-gradient(#ffffff 1px, transparent 1px), linear-gradient(90deg, #ffffff 1px, transparent 1px); background-size: 50px 50px;">
  </div>

  <div class="relative z-10 max-w-2xl mx-auto px-4 sm:px-6 text-center py-20">

    <!-- Icon -->
    <div class="mx-auto mb-7 w-20 h-20 rounded-2xl bg-orange-500/10 border border-orange-500/20 flex items-center justify-center shadow-lg shadow-orange-500/10">

      <svg
        xmlns="http://www.w3.org/2000/svg"
        viewBox="0 0 24 24"
        fill="none"
        stroke="currentColor"
        stroke-width="1.7"
        stroke-linecap="round"
        stroke-linejoin="round"
        class="w-10 h-10 text-orange-400">

        <path d="M12 3v2"></path>
        <path d="M12 19v2"></path>
        <path d="M3 12h2"></path>
        <path d="M19 12h2"></path>

        <path d="m5.64 5.64 1.42 1.42"></path>
        <path d="m16.94 16.94 1.42 1.42"></path>

        <path d="m5.64 18.36 1.42-1.42"></path>
        <path d="m16.94 7.06 1.42-1.42"></path>

        <circle cx="12" cy="12" r="4"></circle>
      </svg>

    </div>

    <!-- 404 -->
    <div class="relative">

      <div class="text-[100px] sm:text-[140px] leading-none font-extrabold font-heading tracking-tight
                  text-transparent bg-clip-text bg-gradient-to-r from-orange-400 via-orange-300 to-blue-400">
        404
      </div>

      <!-- Small glow -->
      <div class="absolute inset-0 flex items-center justify-center -z-10">
        <div class="w-64 h-32 bg-orange-500/10 blur-3xl rounded-full"></div>
      </div>

    </div>

    <!-- Content -->
    <div class="mt-2 space-y-4">

      <span class="inline-flex items-center gap-2 px-3.5 py-1.5 rounded-full
                   bg-blue-500/10 border border-blue-500/20
                   text-blue-300 text-xs font-semibold tracking-wide">

        <span class="w-1.5 h-1.5 rounded-full bg-orange-400"></span>
        PAGE NOT FOUND

      </span>

      <h1 class="text-2xl sm:text-4xl font-extrabold font-heading tracking-tight">
        Looks like you're off the grid
      </h1>

      <p class="text-sm sm:text-base text-slate-400 max-w-md mx-auto leading-relaxed">
        The page you're looking for may have been moved, removed,
        or is no longer available.
      </p>

    </div>

    <!-- Buttons -->
    <div class="flex flex-col sm:flex-row items-center justify-center gap-3 mt-8">

      <a
        routerLink="/"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2
               bg-orange-500 hover:bg-orange-400
               text-slate-950 font-bold
               px-6 py-3.5 rounded-xl
               shadow-lg shadow-orange-500/20
               transition duration-200
               hover:-translate-y-0.5">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4">

          <path d="m3 12 2-2m0 0 7-7 7 7m-14 0v8a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2v-8"></path>
          <path d="M9 20v-6h6v6"></path>

        </svg>

        Back to Home

      </a>

      <button
        type="button"
        onclick="history.back()"
        class="w-full sm:w-auto inline-flex items-center justify-center gap-2
               bg-slate-800/80 hover:bg-slate-700
               border border-slate-700
               text-white font-semibold
               px-6 py-3.5 rounded-xl
               transition duration-200">

        <svg
          xmlns="http://www.w3.org/2000/svg"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          class="w-4 h-4">

          <path d="m15 18-6-6 6-6"></path>

        </svg>

        Go Back

      </button>

    </div>

    <!-- Bottom hint -->
    <div class="mt-10 pt-6 border-t border-slate-800/80">

      <p class="text-xs text-slate-500">
        Looking for our products?
        <a
          routerLink="/products"
          class="text-orange-400 hover:text-orange-300 font-semibold transition">
          Explore Solar &amp; LED Solutions →
        </a>
      </p>

    </div>

  </div>
</section>
